<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="nexus-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="nexus-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0f0728"/>
  <circle cx="50" cy="50" r="40" stroke="url(#ring-grad)" stroke-width="3" filter="url(#nexus-glow)" />
  <circle cx="50" cy="50" r="34" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.6" />
  <g stroke="url(#nexus-grad)" stroke-width="1.5" opacity="0.8">
    <line x1="50" y1="16" x2="32" y2="30" />
    <line x1="50" y1="16" x2="68" y2="30" />
    <line x1="32" y1="30" x2="24" y2="50" />
    <line x1="68" y1="30" x2="76" y2="50" />
    <line x1="24" y1="50" x2="32" y2="70" />
    <line x1="76" y1="50" x2="68" y2="70" />
    <line x1="32" y1="70" x2="50" y2="84" />
    <line x1="68" y1="70" x2="50" y2="84" />
    <line x1="50" y1="16" x2="50" y2="36" />
    <line x1="50" y1="84" x2="50" y2="64" />
  </g>
  <path d="M 37 63 V 37 L 63 63 V 37" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#nexus-glow)"/>
  <path d="M 37 63 V 37 L 63 63 V 37" stroke="url(#ring-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e9d5ff">
    <circle cx="50" cy="16" r="3" />
    <circle cx="32" cy="30" r="3" />
    <circle cx="68" cy="30" r="3" />
    <circle cx="24" cy="50" r="3" />
    <circle cx="76" cy="50" r="3" />
    <circle cx="32" cy="70" r="3" />
    <circle cx="68" cy="70" r="3" />
    <circle cx="50" cy="84" r="3" />
